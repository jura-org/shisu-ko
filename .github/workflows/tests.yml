name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lets a branch be checked before it is merged: gh workflow run tests.yml --ref <branch>
  workflow_dispatch:

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    name: Server (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.12", "3.13"]
        include:
          # The Windows-only paths (the registry registration of the Start button's launcher,
          # the msvcrt instance lock, the .cmd wrapper and run.cmd) are skipped everywhere else.
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check the syntax of the Python entry points
        shell: bash
        run: |
          for f in server/server.py server/update.py server/native_host.py; do
            python -W error -c "import ast, sys; ast.parse(open(sys.argv[1], encoding='utf-8').read())" "$f"
          done
      - name: Install test dependencies
        run: pip install -r server/requirements-test.txt
      # The runtime dependencies are not needed by the tests, but every Python in the matrix
      # must be able to install and import them: setup.cmd / setup.sh take whatever Python 3.10+
      # runs on the machine, so a version without wheels would fail the user, not CI.
      - name: Install and import the server's runtime dependencies
        run: |
          pip install -r server/requirements.txt
          python -c "import faster_whisper, av, yt_dlp, numpy"
      - name: Run server tests
        run: python -m pytest server/tests -v

  launchers:
    name: Launcher scripts (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check shell syntax and the executable bits
        run: |
          bash -n server/run.sh server/setup.sh server/native-host.sh scripts/launcher-smoke.sh
          for f in server/run.sh server/setup.sh server/native-host.sh scripts/launcher-smoke.sh; do
            case "$(git ls-files -s "$f" | cut -c1-6)" in
              100755) ;;
              *) echo "$f is not executable in git"; exit 1 ;;
            esac
          done
      # Firefox's folder, and Chrome's and Chromium's under XDG_CONFIG_HOME (the runner sets one;
      # it is pointed into the scratch profile, away from ~/.config, to show that it is followed).
      - name: Register and unregister the Start button's launcher in a scratch profile
        run: |
          export HOME="$(mktemp -d)"
          export XDG_CONFIG_HOME="$HOME/xdg-config"
          python server/native_host.py --status
          python server/native_host.py --register --verbose
          python - <<'EOF'
          import json, os
          home, config = os.environ["HOME"], os.environ["XDG_CONFIG_HOME"]
          manifests = {
              f"{home}/.mozilla/native-messaging-hosts/shisuko.json": ("allowed_extensions", ["shisu-ko@multysquid.github.io"]),
              f"{config}/google-chrome/NativeMessagingHosts/shisuko.json": ("allowed_origins", ["chrome-extension://ecenifonpkaiccmmknpbllbebbfigjnm/"]),
              f"{config}/chromium/NativeMessagingHosts/shisuko.json": ("allowed_origins", ["chrome-extension://ecenifonpkaiccmmknpbllbebbfigjnm/"]),
          }
          for path, (key, allowed) in manifests.items():
              m = json.load(open(path))
              assert m["name"] == "shisuko" and m["type"] == "stdio", m
              assert m[key] == allowed and set(m) == {"name", "description", "path", "type", key}, m
              assert m["path"].endswith("/server/native-host.sh") and os.access(m["path"], os.X_OK), m
          assert not os.path.exists(f"{home}/.config"), "XDG_CONFIG_HOME was not followed"
          EOF
          status="$(python server/native_host.py --status)"
          echo "$status"
          for browser in Firefox Chrome Chromium; do
            echo "$status" | grep -q "$browser registered at"
          done
          python server/native_host.py --unregister --verbose
          test ! -f "$HOME/.mozilla/native-messaging-hosts/shisuko.json"
          test ! -f "$XDG_CONFIG_HOME/google-chrome/NativeMessagingHosts/shisuko.json"
          test ! -f "$XDG_CONFIG_HOME/chromium/NativeMessagingHosts/shisuko.json"
          python server/native_host.py --status | grep -q "^Start button launcher: not registered"
      - name: Drive the real run.sh through register, update, exit code 4 and restart, and setup.sh under yes 1
        run: bash scripts/launcher-smoke.sh

  addon:
    name: Extension (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Check extension script syntax
        run: |
          for f in addon/*.js; do node --check "$f"; done
      - name: Run extension tests
        run: node --test addon/tests/*.test.js
      - name: Install build dependencies
        run: npm ci
      - name: Run build tests
        run: npm run test:build
      # Any release may be published on the listing with these texts (amo-listing.yml, from its
      # tag); a version bump without new release notes fails here rather than at that point.
      - name: Check the addons.mozilla.org listing texts
        run: python3 docs/amo/make_metadata.py
      - name: Lint Firefox package
        run: npx --yes web-ext@10.7.0 lint --source-dir addon
      - name: Build browser packages
        run: npm run build
      - name: Upload browser packages
        uses: actions/upload-artifact@v4
        with:
          name: shisu-ko-extensions-node-${{ matrix.node-version }}
          path: |
            dist/*.zip

  browser:
    name: Chrome smoke test
    runs-on: ubuntu-latest
    needs: addon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
